plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

android {
    namespace 'com.truong.darongmobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.truong.darongmobile'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '5.0-android'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython 'python'
        pip {
            install 'requests==2.32.5'
            install 'urllib3==2.5.0'
            install 'python-socketio==5.11.4'
            install 'python-engineio==4.9.1'
            install 'websocket-client==1.8.0'
            install 'simple-websocket==1.1.0'
            install 'bidict==0.23.1'
            install 'python-dateutil==2.9.0.post0'
            install 'six==1.17.0'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
