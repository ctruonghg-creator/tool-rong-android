name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.13"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. Lấy source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Python 3.13 cho Chaquopy
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # 4. Android SDK
      # KHÔNG dùng sdkmanager thủ công
      # KHÔNG cài package "tools"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;35.0.0
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"

      # 5. Tải Gradle 8.13
      - name: Download Gradle 8.13
        shell: bash
        run: |
          set -e

          curl -fL --retry 5 --retry-delay 2 \
            -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q /tmp/gradle.zip -d /tmp

          test -x "/tmp/gradle-${GRADLE_VERSION}/bin/gradle"

          echo "Gradle version:"
          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" --version

      # 6. Kiểm tra Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android platform:"
          ls -la "$ANDROID_SDK_ROOT/platforms/android-36"

          echo "Build tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      # 7. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # 8. Kiểm tra APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      # 9. Xuất APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daorong-android16-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
